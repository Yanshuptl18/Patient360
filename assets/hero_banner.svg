<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" style="background:#080e1a; border-radius:12px; border:1px solid #1e293b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="70%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="25%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="neonBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonEmerald" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .grid-line { stroke: #1e293b; stroke-width: 0.5; stroke-opacity: 0.4; stroke-dasharray: 4 6; }
    
    @keyframes pulseRing {
      0% { r: 6px; opacity: 0.9; }
      50% { r: 18px; opacity: 0.1; }
      100% { r: 6px; opacity: 0.9; }
    }
    @keyframes pulseRingLarge {
      0% { r: 8px; opacity: 0.8; }
      50% { r: 24px; opacity: 0.15; }
      100% { r: 8px; opacity: 0.8; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ecgPulse {
      0% { stroke-dashoffset: 600; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -600; opacity: 0.2; }
    }
    @keyframes floatY {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .pulse-ring-1 { animation: pulseRing 2.4s infinite ease-in-out; }
    .pulse-ring-2 { animation: pulseRing 3.1s infinite ease-in-out 0.8s; }
    .pulse-ring-3 { animation: pulseRingLarge 2.8s infinite ease-in-out 1.4s; }
    .flow-line { stroke-dasharray: 8 6; animation: dashMove 4s linear infinite; }
    .ecg-line { stroke-dasharray: 300 300; animation: ecgPulse 4.5s ease-in-out infinite; }
    .badge-card { animation: floatY 4s ease-in-out infinite; }
  ]]></style>

  <!-- Background Rect -->
  <rect width="960" height="320" fill="url(#bgGrad)" rx="12"/>
  <rect width="960" height="320" fill="url(#glowTeal)" rx="12"/>
  <rect width="960" height="320" fill="url(#glowEmerald)" rx="12"/>

  <!-- Technical Grid Background -->
  <g class="grid-line">
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="680" y1="0" x2="680" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="920" y1="0" x2="920" y2="320"/>
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
  </g>

  <!-- ECG Heartbeat / Clinical Vital Waveform -->
  <path d="M 450,220 L 520,220 L 535,200 L 545,245 L 560,165 L 575,250 L 585,210 L 600,220 L 720,220 L 735,195 L 745,240 L 760,170 L 775,245 L 785,215 L 800,220 L 920,220" 
        fill="none" stroke="#0ea5e9" stroke-width="2" class="ecg-line" filter="url(#neonBlue)"/>

  <!-- Evidence Network Graph Lines -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.4">
    <line x1="640" y1="90" x2="770" y2="70" class="flow-line"/>
    <line x1="770" y1="70" x2="870" y2="130" class="flow-line"/>
    <line x1="770" y1="70" x2="710" y2="160" class="flow-line"/>
    <line x1="710" y1="160" x2="840" y2="180" class="flow-line"/>
    <line x1="840" y1="180" x2="870" y2="130" class="flow-line"/>
    <line x1="640" y1="90" x2="710" y2="160"/>
  </g>

  <!-- Network Nodes & Glowing Halo Rings -->
  <!-- Node 1: FastEmbed Vector Index -->
  <circle cx="640" cy="90" r="16" fill="#0ea5e9" opacity="0.2" class="pulse-ring-1"/>
  <circle cx="640" cy="90" r="6" fill="#38bdf8" filter="url(#neonBlue)"/>
  <text x="640" y="72" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">Vector Search</text>

  <!-- Node 2: Timeline Events -->
  <circle cx="770" cy="70" r="20" fill="#10b981" opacity="0.2" class="pulse-ring-3"/>
  <circle cx="770" cy="70" r="7" fill="#34d399" filter="url(#neonEmerald)"/>
  <text x="770" y="50" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">Care Timeline</text>

  <!-- Node 3: Grounded Citations -->
  <circle cx="870" cy="130" r="15" fill="#0ea5e9" opacity="0.2" class="pulse-ring-2"/>
  <circle cx="870" cy="130" r="6" fill="#38bdf8" filter="url(#neonBlue)"/>
  <text x="870" y="114" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">Page Citation</text>

  <!-- Node 4: Conflict Detector -->
  <circle cx="710" cy="160" r="14" fill="#f59e0b" opacity="0.2" class="pulse-ring-1"/>
  <circle cx="710" cy="160" r="5" fill="#fbbf24"/>
  <text x="710" y="184" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">Conflict Engine</text>

  <!-- Node 5: Tenant Isolation -->
  <circle cx="840" cy="180" r="14" fill="#0ea5e9" opacity="0.2" class="pulse-ring-2"/>
  <circle cx="840" cy="180" r="5" fill="#38bdf8" filter="url(#neonBlue)"/>
  <text x="840" y="202" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">Patient Isolation</text>

  <!-- Left Hero Typography -->
  <g transform="translate(60, 50)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8" filter="url(#neonBlue)"/>
    <text x="26" y="17" font-size="11" fill="#7dd3fc" font-weight="600" letter-spacing="0.5">HEALTHCARE INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="72" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">Patient360</text>
    
    <!-- Subtitle Line -->
    <text x="0" y="104" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">Medical Evidence, Brought Together</text>
    
    <!-- Accent Line -->
    <rect x="0" y="122" width="460" height="2" fill="url(#accentLine)"/>

    <!-- Description Paragraph -->
    <text x="0" y="148" font-size="13" fill="#cbd5e1" font-weight="400">Synthesizing fragmented clinical records and biomedical research</text>
    <text x="0" y="168" font-size="13" fill="#cbd5e1" font-weight="400">into an evidence-grounded workspace with page-level citations.</text>
  </g>

  <!-- Live Status Card (Bottom Left) -->
  <g transform="translate(60, 245)" class="badge-card">
    <rect x="0" y="0" width="370" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#10b981" filter="url(#neonEmerald)"/>
    <text x="34" y="18" font-size="11" fill="#f8fafc" font-weight="600">Hybrid Retrieval + Physical Page Citations</text>
    <text x="34" y="32" font-size="10" fill="#64748b">Dense FastEmbed (384-d) • Okapi BM25 • Reciprocal Rank Fusion</text>
  </g>
</svg>
