services:
  - type: web
    name: patient360-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_demo_data.py && exec uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./patient360.db
      - key: STORAGE_LOCAL_PATH
        value: ./storage/documents
      - key: LLM_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
