steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'deployment/docker/backend.Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/patient360/backend:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/patient360/backend:latest'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/patient360/backend:latest'
options:
  logging: CLOUD_LOGGING_ONLY
